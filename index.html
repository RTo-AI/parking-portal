<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2d5c">
  <meta http-equiv="refresh" content="1.2;url=https://script.google.com/macros/s/AKfycbz-wXB7DVLMAG0bb2V-argyd1m-RpumvF5cOHyqaFYOcUwSipoVLrOrejOdTaRfFtie/exec?view=request">
  <title>Control de Autorizaciones de Parqueo Sótano</title>
  <style>
    :root{--blue:#0b2d5c;--orange:#f36c21;--bg:#f4f7fb;--ink:#172b4d;--muted:#5d6b7a;--line:#d9e2ec}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 14px 36px rgba(11,45,92,.08)}
    .mark{width:72px;height:72px;margin:0 auto 22px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;letter-spacing:-1px}
    h1{margin:0;color:var(--blue);font-size:clamp(26px,7vw,36px);line-height:1.08}
    .sub{margin:12px 0 0;font-size:18px;font-weight:700}
    .dept{margin:6px 0 28px;color:var(--muted);font-size:15px}
    .loading{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 18px;color:var(--blue);font-weight:700}
    .spinner{width:20px;height:20px;border:3px solid #dbe4ef;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    a.button{display:inline-block;margin-top:8px;padding:14px 22px;border-radius:12px;background:var(--orange);color:#fff;text-decoration:none;font-weight:800}
    footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">RT</div>
    <h1>Control de Autorizaciones de Parqueo Sótano</h1>
    <div class="sub">Portal de Solicitudes</div>
    <div class="dept">Facilities Management &amp; Security</div>

    <div class="loading">
      <span class="spinner" aria-hidden="true"></span>
      <span>Abriendo portal...</span>
    </div>

    <a class="button" href="https://script.google.com/macros/s/AKfycbz-wXB7DVLMAG0bb2V-argyd1m-RpumvF5cOHyqaFYOcUwSipoVLrOrejOdTaRfFtie/exec?view=request">INGRESAR AL PORTAL</a>

    <footer>
      Sistema de Gestión de Acceso y Parqueos<br>
      Facilities Management &amp; Security - RT
    </footer>
  </main>

  <script>
    const destination = "https://script.google.com/macros/s/AKfycbz-wXB7DVLMAG0bb2V-argyd1m-RpumvF5cOHyqaFYOcUwSipoVLrOrejOdTaRfFtie/exec?view=request";
    window.setTimeout(() => {
      window.location.replace(destination);
    }, 900);
  </script>
</body>
</html>
